[project]
name = "research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rdndds", email = "rdndds@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.16.3",
    "ddgs>=9.16.0",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
]

[project.scripts]
research = "research:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
